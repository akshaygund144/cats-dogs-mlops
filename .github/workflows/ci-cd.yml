name: Cats Dogs MLOps CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

# Required for GitHub Container Registry
permissions:
  contents: read
  packages: write

jobs:

  # =========================================================
  # CI - Test
  # =========================================================

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: |
          pytest -q


  # =========================================================
  # CD - Docker Build
  # =========================================================

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t cats-dogs-api:latest .

      - name: Verify Docker image
        run: |
          docker images cats-dogs-api


  # =========================================================
  # CD - Publish Docker Image to GitHub Container Registry
  # =========================================================

  docker-publish:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs: docker-build

    # Only publish when code is pushed to master.
    # Pull requests will still build and test the image,
    # but will not publish it.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/cats-dogs-api:latest \
            -t ghcr.io/${{ github.repository_owner }}/cats-dogs-api:${{ github.sha }} \
            .

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/cats-dogs-api:latest
          docker push ghcr.io/${{ github.repository_owner }}/cats-dogs-api:${{ github.sha }}

      - name: Verify published image
        run: |
          echo "Docker image published successfully"
          echo "ghcr.io/${{ github.repository_owner }}/cats-dogs-api:latest"
          echo "ghcr.io/${{ github.repository_owner }}/cats-dogs-api:${{ github.sha }}"