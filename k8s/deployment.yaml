apiVersion: apps/v1
kind: Deployment
metadata:
  name: cats-dogs-api
  namespace: cats-dogs
spec:
  replicas: 1

  selector:
    matchLabels:
      app: cats-dogs-api

  template:
    metadata:
      labels:
        app: cats-dogs-api

    spec:
      containers:
        - name: cats-dogs-api
          image: cats-dogs-api:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5000

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"

            limits:
              cpu: "1"
              memory: "1Gi"

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 20